<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підслухано Буча</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        .photo-hover:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }
        .neon-text {
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }
        .blink {
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gradient-to-r from-pink-300 via-purple-300 to-pink-300">
    <header class="bg-pink-700 text-lime-400 text-center py-8">
        <h1 class="text-6xl font-extrabold neon-text blink" style="font-family: 'Bebas Neue', sans-serif;">ПІДСЛУХАНО БУЧА 🔥</h1>
    </header>
    <main class="container mx-auto py-10">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="text-center">
                <img src="img/Игорек 12.png" alt="Photo 1" class="w-full h-64 object-cover rounded-xl shadow-lg photo-hover border-4 border-pink-500">
                <p class="mt-2 text-lg font-semibold text-white">Репшери але не законтачені, справа гроза хмельницької області</p>
            </div>
            <div class="text-center">
                <img src="img/Dasha.jpg" alt="Photo 2" class="w-full h-64 object-cover rounded-xl shadow-lg photo-hover border-4 border-lime-400">
                <p class="mt-2 text-lg font-semibold text-white">Хуй пойми що робила вчора(не законтачена)</p>
            </div>
            <div class="text-center">
                <img src="img/Oleg.png" alt="Photo 3" class="w-full h-64 object-cover rounded-xl shadow-lg photo-hover border-4 border-pink-500">
                <p class="Abdula_Bulba но не законтачен">Abdula Bulba но не законтачен</p>
            </div>
            <div class="text-center">
                <img src="img/Харик.jpg" alt="Photo 4" class="w-full h-64 object-cover rounded-xl shadow-lg photo-hover border-4 border-lime-400">
                <p class="mt-2 text-lg font-semibold text-white">Просто далбаеб, но не законтачен</p>
            </div>
            <div class="text-center">
                <img src="img/Ковбой хотел зажать броник.png" alt="Photo 5" class="w-full h-64 object-cover rounded-xl shadow-lg photo-hover border-4 border-pink-500">
                <p class="mt-2 text-lg font-semibold text-white">Ковбой хотел спиздить у меня 1 броник</p>
            </div>
            <div class="text-center">
                <img src="img/Сеня.jpg" alt="Photo 6" class="w-full h-64 object-cover rounded-xl shadow-lg photo-hover border-4 border-lime-400">
                <p class="mt-2 text-lg font-semibold text-white">Сеня главный по главным</p>
            </div>
        </div>
    </main>
    <footer class="bg-pink-800 text-lime-300 text-center py-6">
        <p class="text-2xl font-bold neon-text" style="font-family: 'Bebas Neue', sans-serif;">© 2025 ПІДСЛУХАНО БУЧА </p>
    </footer>
</body>
</html>
